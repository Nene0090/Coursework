<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Дашборд продуктивности ИТ‑подразделения</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="dark">

<div id="overlay"></div>

<header class="header">
    <h1>Дашборд продуктивности ИТ‑подразделения</h1>

    <div class="top-buttons">
        <button id="themeBtn">Светлая тема</button>
        <button id="menuBtn">Меню</button>
    </div>
</header>

<div class="chart-fullscreen">
    <div class="period-switcher">
        <button onclick="setPeriod('hour')">Часы</button>
        <button onclick="setPeriod('day')">Дни</button>
        <button onclick="setPeriod('week')">Недели</button>
        <button onclick="setPeriod('month')">Месяц</button>
    </div>

    <canvas id="mainChart"></canvas>
</div>

<div class="side-menu" id="sideMenu">
    <div class="menu-header">
        <h2>Графики</h2>
        <button class="closeMenu" onclick="toggleMenu()">
            <svg viewBox="0 0 24 24" width="18" height="18">
                <line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                <line x1="20" y1="4" x2="4" y2="20" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            </svg>
        </button>
    </div>
    <button id="btnSLA" onclick="loadSLA()">SLA по приоритетам</button>
    <button id="btnLoad" onclick="loadLoad()">Загрузка исполнителей</button>
    <button id="btnCombined" onclick="loadCombined()">Динамика тикетов</button>
    <button id="btnStatuses" onclick="loadStatuses()">Статусы тикетов</button>
    <button id="btnLines" onclick="loadLinesStatuses()">Статусы по линиям</button>
</div>

<script type="module">
import { dashboardRequest } from "./fetch.js";

let chart;

let accessLevel = Number(localStorage.getItem("accessLevel") || 0);

if (accessLevel === 0) {
    window.location.href = "login.html";
}

let userRole = "user";

if (accessLevel === 1) userRole = "user";
if (accessLevel === 2) userRole = "employee";
if (accessLevel === 3) userRole = "admin";

function applyRoleAccess() {
    if (userRole === "admin") return;

    if (userRole === "employee") {
        document.getElementById("btnSLA").style.display = "none";
    }

    if (userRole === "user") {
        document.getElementById("btnSLA").style.display = "none";
        document.getElementById("btnLoad").style.display = "none";
        document.getElementById("btnCombined").style.display = "none";
    }
}

document.getElementById("themeBtn").onclick = () => {
    document.body.classList.toggle("dark");
    document.body.classList.toggle("light");

    const themeBtn = document.getElementById("themeBtn");

    themeBtn.textContent =
        document.body.classList.contains("light")
            ? "Тёмная тема"
            : "Светлая тема";

    if (chart) {
        const textColor = getTextColor();
        const gridColor = document.body.classList.contains("light")
            ? "#c7d7f5"
            : "#2c3e55";

        if (chart.options.scales?.x) {
            chart.options.scales.x.ticks.color = textColor;
            chart.options.scales.x.grid.color = gridColor;
        }

        if (chart.options.scales?.y) {
            chart.options.scales.y.ticks.color = textColor;
            chart.options.scales.y.grid.color = gridColor;
        }

        if (chart.options.plugins?.legend) {
            chart.options.plugins.legend.labels.color = textColor;
        }

        chart.update();
    }
};

function toggleMenu() {
    const menu = document.getElementById("sideMenu");
    const overlay = document.getElementById("overlay");
    menu.classList.toggle("open");
    overlay.classList.toggle("show");
}

document.getElementById("menuBtn").onclick = toggleMenu;

document.getElementById("overlay").onclick = () => {
    document.getElementById("sideMenu").classList.remove("open");
    document.getElementById("overlay").classList.remove("show");
};

function getTextColor() {
    return document.body.classList.contains("light")
        ? "#1a2536"
        : "#d0e4ff";
}

function showPeriods(show) {
    document.querySelector(".period-switcher").style.display = show ? "flex" : "none";
}

function renderChart(type, labels, datasets) {
    if (chart) chart.destroy();

    const ctx = document.getElementById("mainChart").getContext("2d");

    chart = new Chart(ctx, {
        type: type,
        data: {
            labels: labels,
            datasets: datasets
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                tooltip: { enabled: true },
                legend: {
                    position: "bottom",
                    labels: { color: getTextColor() }
                }
            },
            scales: type === "pie" || type === "doughnut"
                ? {}
                : {
                    x: {
                        ticks: { color: getTextColor() },
                        grid: {
                            color: document.body.classList.contains("light")
                                ? "#c7d7f5"
                                : "#2c3e55"
                        }
                    },
                    y: {
                        beginAtZero: true,
                        ticks: { color: getTextColor() },
                        grid: {
                            color: document.body.classList.contains("light")
                                ? "#c7d7f5"
                                : "#2c3e55"
                        }
                    }
                }
        }
    });
}

class DashboardUpdater {
    async request(type) {
        try {
            const data = await dashboardRequest(type);

            if (data.error) {
                console.error("Ошибка сервера:", data.error);
                return;
            }

            this.apply(data);

        } catch (err) {
            console.error("Ошибка получения данных:", err);
        }
    }

    apply(data) {
        if (!data || !data.type || !data.labels || !data.datasets) {
            console.error("Неверный формат данных:", data);
            return;
        }

        switch (data.type) {
            case "sla":
            case "load":
            case "combined_hour":
            case "combined_day":
            case "combined_week":
            case "combined_month":
            case "lines":
                renderChart("bar", data.labels, data.datasets);
                break;

            case "statuses":
                renderChart("pie", data.labels, data.datasets);
                break;

            default:
                console.error("Неизвестный тип графика:", data.type);
        }
    }
}

const update = new DashboardUpdater();

function loadSLA() {
    if (userRole !== "admin") return;
    showPeriods(false);
    update.request("sla");
}

function loadLoad() {
    if (userRole === "user") return;
    showPeriods(false);
    update.request("load");
}

function loadCombined() {
    if (userRole === "user") return;
    showPeriods(true);
    update.request("combined_day");
}

function loadCombinedHour() {
    if (userRole === "user") return;
    showPeriods(true);
    update.request("combined_hour");
}

function loadCombinedWeek() {
    if (userRole === "user") return;
    showPeriods(true);
    update.request("combined_week");
}

function loadCombinedMonth() {
    if (userRole === "user") return;
    showPeriods(true);
    update.request("combined_month");
}

function setPeriod(period) {
    if (period === "hour") loadCombinedHour();
    if (period === "day") loadCombined();
    if (period === "week") loadCombinedWeek();
    if (period === "month") loadCombinedMonth();
}

function loadStatuses() {
    showPeriods(false);
    update.request("statuses");
}

function loadLinesStatuses() {
    showPeriods(false);
    update.request("lines");
}

function logout() {
    localStorage.removeItem("accessLevel");
    window.location.href = "index.html";
}

applyRoleAccess();
showPeriods(false);
loadStatuses();
</script>
</body>
</html>
