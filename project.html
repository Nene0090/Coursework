<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Дашборд продуктивности ИТ‑подразделения</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="dark">

<div id="ovwrlay"></div>

<header class="header">
    <h1>Дашборд продуктивности ИТ‑подразделения</h1>

    <div class="top-buttons">
        <button id="themeBtn">Светлая тема</button>
        <button id="menuBtn">Меню</button>
    </div>
</header>

<div class="chart-fullscreen">
    <div class="period-switcher">
        <button onclick="setPeriod('hour')">Часы</button>
        <button onclick="setPeriod('day')">Дни</button>
        <button onclick="setPeriod('week')">Недели</button>
        <button onclick="setPeriod('month')">Месяц</button>
    </div>

    <canvas id="mainChart"></canvas>
</div>

<div class="side-menu" id="sideMenu">
    <div class="menu-header">
        <h2>Графики</h2>
        <button class="closeMenu" onclick="toggleMenu()">✖</button>
    </div>
    <button id="btnSLA" onclick="loadSLA()">SLA по приоритетам</button>
    <button id="btnLoad" onclick="loadLoad()">Загрузка исполнителей</button>
    <button id="btnCombined" onclick="loadCombined()">Динамика тикетов</button>
    <button id="btnStatuses" onclick="loadStatuses()">Статусы тикетов</button>
    <button id="btnLines" onclick="loadLinesStatuses()">Статусы по линиям</button>
    <button id="btnBase" onclick="loadBaseData()">Загрузить базу данных</button>
</div>

<script>
let userRole = "admin";

function applyRoleAccess() {
    if (userRole === "admin"){
        return;
    }

    if (userRole === "employee"){
        document.getElementById("btnSLA").style.display = "none";
        document.getElementById("btnBase").style.display = "none";
    }

    if (userRole === "user"){
        document.getElementById("btnSLA").style.display = "none";
        document.getElementById("btnLoad").style.display = "none";
        document.getElementById("btnCombined").style.display = "none";
        document.getElementById("btnBase").style.display = "none";
    }
}
let chart;
document.getElementById("themeBtn").onclick = () => {
    document.body.classList.toggle("dark");
    document.body.classList.toggle("light");

    themeBtn.textContent =
        document.body.classList.contains("light")
            ? "Тёмная тема"
            : "Светлая тема";

    if (chart) {
        const isLight = document.body.classList.contains("light");

        chart.options.scales.x.ticks.color = isLight ? "#1a2536" : "#d0e4ff";
        chart.options.scales.y.ticks.color = isLight ? "#1a2536" : "#d0e4ff";

        chart.options.scales.x.grid.color = isLight ? "#c7d7f5" : "#2c3e55";
        chart.options.scales.y.grid.color = isLight ? "#c7d7f5" : "#2c3e55";

        if (chart.options.plugins.legend) {
            chart.options.plugins.legend.labels.color = isLight ? "#1a2536" : "#d0e4ff";
        }

        chart.update();
    }
};

document.getElementById("menuBtn").onclick = toggleMenu;

function toggleMenu() {
    const menu = document.getElementById("sideMenu");
    const overlay = document.getElementById("overlay");

    menu.classList.toggle("open");
    overlay.classList.toggle("show");
}

document.getElementById("overlay").onclick = () => {
    document.getElementById("sideMenu").classList.remove("open");
    document.getElementById("overlay").classList.remove("show");
};

function renderChart(type, labels, datasets) {
    if (chart) chart.destroy();

    const ctx = document.getElementById('mainChart').getContext('2d');

    chart = new Chart(ctx, {
        type: type,
        data: { labels, datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                tooltip: { enabled: true },
                legend: { position: 'bottom', labels: { color: getTextColor() } }
            },
            scales: {
                x: { ticks: { color: getTextColor() } },
                y: { ticks: { color: getTextColor() } }
            }
        }
    });
}

function getTextColor() {
    return document.body.classList.contains("light") ? "#1a2536" : "#d0e4ff";
}

function showPeriods(show) {
    document.querySelector(".period-switcher").style.display = show ? "flex" : "none";
}

function loadCombined() {
    if (userRole === "user") return;
    showPeriods(true);

    const labels = ["01.04", "02.04", "03.04", "04.04"];

    const datasets = [
        {
            type: "bar",
            label: "Количество тикетов",
            data: [15, 20, 18, 25],
            backgroundColor: "rgba(80,150,255,0.6)",
            borderColor: "rgba(80,150,255,1)",
            borderWidth: 2
        },
        {
            type: "line",
            label: "Время реакции (мин)",
            data: [10, 15, 12, 18],
            borderColor: "rgba(120,180,255,1)",
            borderWidth: 2
        },
        {
            type: "line",
            label: "Время решения (мин)",
            data: [60, 70, 55, 80],
            borderColor: "rgba(160,210,255,1)",
            borderWidth: 2
        }
    ];

    renderChart("bar", labels, datasets);
}

function setPeriod(period) {
    if (period === "hour") loadCombinedHour();
    if (period === "day") loadCombined();
    if (period === "week") loadCombinedWeek();
    if (period === "month") loadCombinedMonth();
}

function loadCombinedHour() {
    if (userRole === "user") return;
    showPeriods(true);
    renderChart("bar",
        ["10:00", "11:00", "12:00", "13:00"],
        [
            { type: "bar", label: "Тикеты", data: [3, 5, 4, 6], backgroundColor: "rgba(80,150,255,0.6)" },
            { type: "line", label: "Реакция", data: [12, 15, 14, 18], borderColor: "rgba(120,180,255,1)" },
            { type: "line", label: "Решение", data: [60, 55, 70, 65], borderColor: "rgba(160,210,255,1)" }
        ]
    );
}

function loadCombinedWeek() {
    if (userRole === "user") return;
    showPeriods(true);
    renderChart("bar",
        ["Пн", "Вт", "Ср", "Чт", "Пт"],
        [
            { type: "bar", label: "Тикеты", data: [20, 25, 18, 30, 22], backgroundColor: "rgba(80,150,255,0.6)" },
            { type: "line", label: "Реакция", data: [12, 14, 13, 16, 15], borderColor: "rgba(120,180,255,1)" },
            { type: "line", label: "Решение", data: [70, 65, 80, 75, 72], borderColor: "rgba(160,210,255,1)" }
        ]
    );
}

function loadCombinedMonth() {
    if (userRole === "user") return;
    showPeriods(true);
    renderChart("bar",
        ["1 неделя", "2 неделя", "3 неделя", "4 неделя"],
        [
            { type: "bar", label: "Тикеты", data: [80, 95, 70, 100], backgroundColor: "rgba(80,150,255,0.6)" },
            { type: "line", label: "Реакция", data: [14, 13, 15, 16], borderColor: "rgba(120,180,255,1)" },
            { type: "line", label: "Решение", data: [75, 80, 70, 85], borderColor: "rgba(160,210,255,1)" }
        ]
    );
}

function loadSLA() {
    if (userRole !== "admin") return;
    showPeriods(false);
    renderChart("bar",
        ["P1", "P2", "P3"],
        [
            { label: "Реакция", data: [12, 25, 80], backgroundColor: "rgba(80,150,255,0.6)" },
            { label: "Решение", data: [50, 180, 400], backgroundColor: "rgba(120,180,255,0.6)" },
            { label: "Нарушения SLA (%)", data: [10, 20, 35], backgroundColor: "rgba(160,210,255,0.6)" }
        ]
    );
}

function loadLoad() {
    if (userRole === "user") return;
    showPeriods(false);

    renderChart("bar",
        ["Иванов", "Петров", "Сидоров"],
        [
            {
                label: "Активные",
                data: [5, 8, 3],
                backgroundColor: "rgba(90,170,255,0.6)"
            },
            {
                label: "Выполненные",
                data: [12, 15, 9],
                backgroundColor: "rgba(100,200,120,0.6)"
            },
            {
                label: "Отложенные",
                data: [3, 2, 1],
                backgroundColor: "rgba(255,200,80,0.6)"
            },
            {
                label: "Брошенные",
                data: [1, 0, 2],
                backgroundColor: "rgba(255,120,120,0.6)"
            }
        ]
    );
}


function loadStatuses() {
    showPeriods(false);

    if (chart) chart.destroy();

    const ctx = document.getElementById('mainChart').getContext('2d');

    chart = new Chart(ctx, {
        type: "pie",
        data: {
            labels: ["Выполнено", "В работе", "Отложено", "Не выполнено"],
            datasets: [
                {
                    label: "Статусы",
                    data: [40, 20, 10, 5],
                    backgroundColor: [
                        "rgba(80,150,255,0.7)",
                        "rgba(120,180,255,0.7)",
                        "rgba(160,210,255,0.7)",
                        "rgba(200,230,255,0.7)"
                    ]
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            layout: {
                padding: 0
            },
            plugins: {
                legend: {
                    position: "bottom",
                    labels: {
                        color: getTextColor()
                    }
                }
            }
        }
    });
}

function loadLinesStatuses() {
    showPeriods(false);
    renderChart("bar",
        ["1-я линия", "2-я линия"],
        [
            { label: "Выполнено", data: [20, 15], backgroundColor: "rgba(80,150,255,0.7)" },
            { label: "В работе", data: [10, 12], backgroundColor: "rgba(120,180,255,0.7)" },
            { label: "Отложено", data: [5, 3], backgroundColor: "rgba(160,210,255,0.7)" }
        ]
    );
}

function loadBaseData() {
    if (userRole !== "admin") return;
    showPeriods(false);
    alert("Загрузка базы...");
}
applyRoleAccess();
</script>

</body>
</html>
